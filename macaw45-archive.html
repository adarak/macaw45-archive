  font-family:"Roboto","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  /* viewport-fit=cover draws under the status bar; keep content below it in
     portrait. Landscape/notchless devices report 0 here, so no effect there. */
  padding-top:env(safe-area-inset-top);
  /* side safe-area margins the video/chat stage keeps clear of the notch.
     The <--> button toggles .immersive to zero these and fill the edges. */
  --safe-l:env(safe-area-inset-left); --safe-r:env(safe-area-inset-right);
}
body.immersive{ --safe-l:0px; --safe-r:0px; }
a{color:inherit; text-decoration:none}

header.site{
  display:flex; align-items:center; gap:12px;
  padding:14px calc(20px + env(safe-area-inset-right)) 14px calc(20px + env(safe-area-inset-left));
  border-bottom:1px solid var(--border);
  background:var(--bg);
  overflow:hidden; max-height:120px;
  transition:max-height .3s ease, padding .3s ease, opacity .25s ease, border-color .3s ease;
}
/* collapsed while a video plays on mobile (JS toggles .collapsed only on phones) */
header.site.collapsed{max-height:0; padding-top:0; padding-bottom:0; opacity:0; border-bottom-color:transparent}
header.site h1{font-size:18px; margin:0; font-weight:700; letter-spacing:.3px; cursor:pointer}
header.site .site-logo{width:34px; height:34px; border-radius:50%; object-fit:cover; cursor:pointer; flex:none}
header.site .site-contact{margin-left:auto; text-align:right; color:var(--muted); font-size:11px; line-height:1.55; max-width:52%}
header.site .site-contact b{color:#ccc; font-weight:600}
@media (max-width:640px), (orientation:landscape) and (max-height:500px){ header.site .site-contact{display:none} }
header.site h1:hover{color:var(--accent)}
header.site .sub{color:var(--muted); font-size:13px}

.wrap{max-width:1280px; margin:0 auto; padding:24px 20px 80px}

/* ---------- featured player ---------- */
.featured{margin-bottom:28px}
.stage{display:flex; gap:14px; align-items:flex-start}
.stage .player-shell{flex:1; min-width:0}
.player-shell{
  position:relative; width:100%; background:#000;
  border-radius:var(--radius); overflow:hidden; aspect-ratio:16/9;
}
.player-shell video{width:100%; height:100%; display:block; background:#000}
.player-shell .video-js{width:100%; height:100%}

/* live-style chat column beside the player (demo build) */
.chat{
  flex:none; width:340px; display:flex; flex-direction:column; position:relative;
  background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius);
  overflow:hidden; aspect-ratio:auto;
  transition:width .28s ease, height .28s ease, opacity .22s ease, border-width .28s ease;
}
/* graceful collapse when chat is toggled off (sibling player expands via flex).
   height:0 so an off chat never adds layout height — at width:0 its buffered
   messages would otherwise wrap into a huge intrinsic height and stretch the row. */
.chat.off{width:0 !important; height:0 !important; min-width:0; min-height:0; opacity:0; border-width:0; pointer-events:none}
.chat-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  padding:10px 12px; border-bottom:1px solid var(--border); flex:none;
}
.chat-title{font-size:13px; font-weight:700; letter-spacing:.3px}
.chat-note{font-size:11px; color:var(--muted)}
/* overscroll-behavior:contain stops chat scroll from chaining into the page (the
   two fighting on touch); touch-action:pan-y keeps vertical drags on the log. */
.chat-log{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; padding:8px 10px; font-size:13px; line-height:1.4}
.chat-log::-webkit-scrollbar{width:8px}
.chat-log::-webkit-scrollbar-thumb{background:#333; border-radius:4px}
/* floating pill to snap back to the newest chat when scrolled up */
.chat-jump{
  position:absolute; left:50%; bottom:12px; transform:translateX(-50%) translateY(8px);
  display:inline-flex; align-items:center; gap:6px; padding:6px 13px;
  border:none; border-radius:999px; cursor:pointer; white-space:nowrap;
  background:var(--ctrl-accent); color:#111; font-size:12px; font-weight:700;
  box-shadow:0 3px 12px rgba(0,0,0,.45); z-index:4;
  opacity:0; pointer-events:none; transition:opacity .16s ease, transform .16s ease;
}
.chat-jump.show{opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0)}
.chat-jump span{font-size:14px; line-height:1}
.cmsg{padding:3px 4px; border-radius:5px; word-wrap:break-word}
.cmsg:hover{background:rgba(255,255,255,.04)}
.cmsg.newsec{margin-top:2px}
.cmsg .cu{font-weight:700}
.cmsg a.cu:hover{text-decoration:underline}
.cmsg .badge{height:18px; vertical-align:middle; margin:0 3px 0 0}
.fine{max-width:900px; margin:0 auto 22px; text-align:center; color:var(--muted); font-size:12px; line-height:1.7}
.fine b{color:#ccc; font-weight:600}
.fine a{color:var(--accent); text-decoration:underline}
.cmsg .emote, .cmsg .third_party_emote, .cmsg .cheer{height:24px; vertical-align:middle; margin:-2px 2px}
.cmsg .cheerbit{display:inline-flex; align-items:center; gap:2px; padding:1px 6px 1px 3px; margin:0 2px; border-radius:6px; background:rgba(255,255,255,.06); border:1px solid var(--border); color:var(--muted); font-weight:700; font-size:12px; vertical-align:middle}
.cmsg .cheerbit .cheer{height:20px; margin:0}
.cmsg .chat_link{color:var(--accent); text-decoration:underline; word-break:break-all}
.chat-empty{color:var(--muted); font-size:12px; padding:10px 4px; line-height:1.6}
@media (max-width:920px){
  .stage{flex-direction:column}
  /* full width, not shrink-to-longest-line — the stage aligns items flex-start */
  .chat{width:100%; height:320px}
}
/* Desktop fullscreen view (the .in-fs class is added by JS on native fullscreen):
   rounded video + rounded chat capsule side by side, padded off the edges.
   Mobile uses native <video> fullscreen instead (no chat), so no mobile rules here. */
.stage.in-fs{width:100%; height:100%; gap:16px; padding:16px; box-sizing:border-box; background:#000; align-items:stretch}
.stage.in-fs .player-shell{flex:1; min-width:0; height:auto; aspect-ratio:auto; border-radius:16px}
.stage.in-fs .chat{display:flex; width:360px; height:auto !important; border-radius:16px; border:1px solid var(--border)}
.stage.in-fs .chat-head{display:none}

/* our own player controls replace video.js's native bar */
.player-shell .vjs-control-bar, .player-shell .vjs-big-play-button{display:none !important}
.ctrl{position:absolute; left:12px; right:12px; bottom:12px; z-index:5; padding:14px 15px 11px; display:flex; flex-direction:column; gap:7px; opacity:1; transition:opacity .2s; background:rgba(18,18,20,.62); backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px); border:1px solid rgba(255,255,255,.08); border-radius:18px; box-shadow:0 4px 18px rgba(0,0,0,.35)}
.ctrl.hide{opacity:0; pointer-events:none}
.ctrl .scrub{position:relative; height:5px; border-radius:3px; background:rgba(255,255,255,.28); cursor:pointer; touch-action:none}
/* invisible taller hit area so the thin track is still easy to grab */
.ctrl .scrub::before{content:""; position:absolute; left:0; right:0; top:-10px; bottom:-10px}
.ctrl .scrub:hover{height:7px}
.ctrl .scrub-buf, .ctrl .scrub-played{position:absolute; left:0; top:0; bottom:0; width:0; border-radius:3px}
.ctrl .scrub-buf{background:rgba(255,255,255,.4)}
.ctrl .scrub-played{background:var(--ctrl-accent)}
.ctrl .scrub-handle{position:absolute; top:50%; left:0; width:13px; height:13px; border-radius:50%; background:#fff; transform:translate(-50%,-50%); opacity:0; transition:opacity .15s; box-shadow:0 0 4px rgba(0,0,0,.5)}
.ctrl .scrub:hover .scrub-handle{opacity:1}
.ctrl-row{display:flex; align-items:center; gap:12px}
.cbtn{background:none; border:0; color:#fff; cursor:pointer; padding:0; display:inline-flex; align-items:center; opacity:.9}
.cbtn:hover{opacity:1}
.cbtn.on{color:var(--ctrl-accent); opacity:1}
/* settings popover (speed / quality / fill-edges) */
.cm-wrap{position:relative; display:inline-flex}
.ctrl-menu{
  position:absolute; bottom:calc(100% + 12px); right:0; z-index:20;
  min-width:220px; padding:8px; display:flex; flex-direction:column; gap:2px;
  background:rgba(24,24,26,.98); border:1px solid rgba(255,255,255,.12); border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.ctrl-menu[hidden]{display:none}
.cm-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 8px 8px}
.cm-label{font-size:13px; font-weight:600; color:#eee}
.cm-speeds{display:flex; flex-wrap:wrap; gap:5px; justify-content:flex-end}
.cm-speed{font-size:12px; padding:4px 8px; border-radius:7px; border:1px solid var(--border); background:#242424; color:#ddd; cursor:pointer; font-variant-numeric:tabular-nums}
.cm-speed:hover{background:#2d2d2d}
.cm-speed.on{background:var(--ctrl-accent); color:#111; border-color:transparent; font-weight:700}
.cm-item{display:flex; align-items:center; gap:9px; width:100%; text-align:left; font-size:13px; color:#eee; background:none; border:0; padding:9px 8px; border-radius:9px; cursor:pointer}
.cm-item:hover{background:rgba(255,255,255,.07)}
.cm-item svg{flex:none; opacity:.85}
.cm-item .cm-txt{flex:1}
.cm-item .cm-state{font-size:12px; color:var(--muted)}
.cm-item.on{color:var(--ctrl-accent)}
.cm-item.on .cm-state{color:var(--ctrl-accent); font-weight:700}
.cm-edge{display:none}   /* fill-edges only makes sense on a landscape phone */
.cm-quality{display:none}  /* revealed by JS once both renditions are found in the master */
.cm-qbtns{display:flex; gap:5px}
.cm-subnote{font-size:11px; color:var(--muted); line-height:1.4; padding:0 8px 6px}
.cbtn .ic{display:block}
.ctime{font-size:12.5px; color:#f0f0f0; font-variant-numeric:tabular-nums; white-space:nowrap}
.ctrl-spacer{flex:1}
.vol{width:84px; cursor:pointer; -webkit-appearance:none; appearance:none; height:4px; border-radius:3px; background:rgba(255,255,255,.32)}
.vol::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:11px; height:11px; border-radius:50%; background:#ffab3d; border:none; cursor:pointer; box-shadow:0 0 3px rgba(0,0,0,.5)}
.vol::-moz-range-thumb{width:11px; height:11px; border:none; border-radius:50%; background:#ffab3d; cursor:pointer; box-shadow:0 0 3px rgba(0,0,0,.5)}
.vol::-moz-range-track{height:4px; border-radius:3px; background:rgba(255,255,255,.32)}
/* Phone: chat defaults off (toggleable), collapsible volume, time only while scrubbing,
   controls below the video, and the media goes full-bleed (no side padding / rounded corners). */
@media (max-width:640px), (orientation:landscape) and (max-height:500px){
  .chat.off{display:none}          /* stacked chat is fully removed when toggled off (no slide) */
  .ctrl [data-a=mute], .ctrl .vol{display:none}   /* no volume UI on phones — use hardware buttons */
  .ctrl .ctime{display:none}
  .ctrl.scrubbing .ctime{display:inline}
  /* controls attached below the video (normal flow) instead of overlaying it */
  .stage:not(.in-fs) .player-shell{aspect-ratio:auto; display:flex; flex-direction:column}
  .stage:not(.in-fs) .player-shell .video-js{height:auto; aspect-ratio:16/9}
  .ctrl{position:static; left:auto; right:auto; bottom:auto; margin:0; align-self:stretch;
    border:0; border-radius:0; box-shadow:none; background:var(--bg2);
    backdrop-filter:none; -webkit-backdrop-filter:none; opacity:1 !important; pointer-events:auto; padding:10px 12px 11px}
  .ctrl.hide{opacity:1 !important; pointer-events:auto}   /* phones: controls stay live below the video */
  /* full-bleed media: no top gap, video + chat run edge to edge, square corners */
  .wrap{padding:0 16px 60px}
  .stage{margin:0 -16px; gap:0; align-items:stretch}   /* stretch chat to full column width */
  .player-shell{border-radius:0}
  .chat{width:auto; align-self:stretch; border-radius:0; border-left:0; border-right:0}
  /* bigger touch-friendly controls (~2x) on phones */
  .ctrl{gap:12px; padding:13px 16px 15px}
  .ctrl-row{gap:22px}
  .ctrl .cbtn svg{width:32px; height:32px}
  .ctrl .scrub{height:9px}
  .ctrl .scrub-handle{width:22px; height:22px}
  .ctrl .ctime{font-size:18px}
  .vol{width:130px; height:7px}
  .vol::-webkit-slider-thumb{width:19px; height:19px}
  .vol::-moz-range-thumb{width:19px; height:19px}
}
/* Landscape phone: put chat BESIDE the video (side-by-side) instead of stacked.
   Overrides the column layout from the max-width:920px + phone rules above.
   The stage owns both physical edges; --safe-l/--safe-r inset it off the notch
   (normal) or collapse to 0 when the <--> button turns on .immersive. */
@media (orientation:landscape) and (max-height:500px){
  /* title/grid keep a 16px gutter (plus the notch inset); only the stage breaks
     out to the physical edges, then re-insets its own content by --safe. */
  .wrap{padding-left:calc(16px + var(--safe-l)); padding-right:calc(16px + var(--safe-r))}
  .stage{margin-left:calc(-16px - var(--safe-l)); margin-right:calc(-16px - var(--safe-r))}
  .stage:not(.in-fs){
    flex-direction:row; align-items:stretch; gap:0;
    padding-left:var(--safe-l); padding-right:var(--safe-r);
  }
  /* JS (sizeStageLandscape) fixes the shell width to (availH - controls) * 16/9 so
     the video+controls fit the display height; chat flexes into whatever's left. */
  .stage:not(.in-fs) .player-shell{flex:0 0 auto; min-width:0; align-self:flex-start}
  .stage:not(.in-fs) .chat:not(.off){
    flex:1 1 auto; width:auto; min-width:250px; max-width:none; height:auto; align-self:stretch;
    border-left:1px solid var(--border);
  }
  .ctrl-menu .cm-edge{display:flex}   /* show the <--> fill-edges toggle here */
}
.feat-title{font-size:22px; font-weight:700; margin:16px 0 10px; line-height:1.3}
.feat-meta{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; color:var(--muted); font-size:14px; margin-bottom:14px}
.btn{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--bg2); border:1px solid var(--border); color:var(--text);
  border-radius:999px; padding:7px 14px; font-size:13px; cursor:pointer;
  font-family:inherit; transition:background .15s,border-color .15s;
}
.btn:hover{background:#262626; border-color:#3a3a3a}
.btn svg{display:block}
.btn.copied{color:#7fe0a3; border-color:#2f6b45}
.feat-desc{
  color:#ddd; font-size:14px; line-height:1.55; white-space:pre-wrap;
}

/* ---------- toolbar ---------- */
.controls{display:flex; flex-direction:column; gap:10px}
.controls input[type=search]{
  width:100%; background:transparent; border:none; border-bottom:2px solid var(--border);
  color:var(--text); border-radius:0; padding:8px 4px; font-size:16px; outline:none;
}
.controls input[type=search]::placeholder{color:#666}
.controls input[type=search]:focus{border-bottom-color:var(--ctrl-accent)}
.searchwrap{position:relative; display:flex}
.searchwrap input[type=search]{padding-left:26px; padding-right:36px}
.search-ico{position:absolute; left:2px; top:50%; transform:translateY(-50%);
  width:16px; height:16px; color:#666; pointer-events:none}
.searchwrap input[type=search]::-webkit-search-cancel-button{display:none}
.search-clear{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  display:none; width:22px; height:22px; padding:0; border:0; border-radius:50%;
  background:#333; color:var(--text); font-size:16px; line-height:1; cursor:pointer;
  align-items:center; justify-content:center;
}
.search-clear:hover{background:#444}
.searchwrap.has-text .search-clear{display:inline-flex}
.controls select{
  width:100%; background:var(--bg2); border:1px solid var(--border); color:var(--text);
  border-radius:8px; padding:10px 12px; font-size:14px; cursor:pointer; font-family:inherit;
}
.sortrow{display:flex; gap:8px}
.sortrow select{flex:1}
.sort-rev{flex:none; width:42px; background:var(--bg2); border:1px solid var(--border);
  color:var(--text); border-radius:8px; font-size:16px; line-height:1; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; font-family:inherit}
.sort-rev:hover{border-color:var(--ctrl-accent)}
.count{color:var(--muted); font-size:13px; padding-left:2px}

/* ---------- continue-watching rail ---------- */
.rail{margin:0 0 34px; background:var(--bg2); border:1px solid var(--border);
  border-radius:var(--radius); padding:12px 18px 14px}
.rail-head{display:flex; align-items:baseline; gap:12px; margin:0 0 16px}
.rail-head > span{font-size:20px; font-weight:700; letter-spacing:.2px; color:var(--text)}
.rail-clear{background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer;
  font-family:inherit; padding:2px 4px}
.rail-clear:hover{color:var(--text); text-decoration:underline}
.rail + .year-h{margin-top:40px}
/* full-width scroller (block, not a flex child) so it never forces the page
   wider on mobile — it just scrolls its row */
.rail-body{position:relative; max-width:100%}
.rail-track{overflow-x:auto; scroll-behavior:smooth; scrollbar-width:none;
  padding:4px 3px; margin:0 -3px}
.rail-track::-webkit-scrollbar{display:none}
/* fade the scrolled-away edge(s) into the box background — overlays so the
   appearance/disappearance can animate (mask-image can't transition) */
.rail-body::before, .rail-body::after{content:''; position:absolute; top:0; bottom:0;
  width:72px; pointer-events:none; z-index:1; opacity:0; transition:opacity .18s ease}
.rail-body::before{left:-4px; background:linear-gradient(90deg, var(--bg2) 0, var(--bg2) 6px, transparent)}
.rail-body::after{right:-4px; background:linear-gradient(270deg, var(--bg2) 0, var(--bg2) 6px, transparent)}
.rail-body.fade-l::before{opacity:1}
.rail-body.fade-r::after{opacity:1}
.rail-row{display:flex; gap:16px}
.rail-row .card{width:250px; flex:none}
/* nav buttons overlay the faded edges so the first card lines up with the title */
/* center on the thumbnail (row pad + half of the 16:9 thumb), not the whole card */
.rail-nav{position:absolute; top:calc(4px + 250px * 9 / 16 / 2); transform:translateY(-50%); z-index:2;
  width:34px; height:34px; border-radius:12px; background:var(--bg);
  border:1px solid var(--border); color:var(--text); cursor:pointer;
  display:flex; align-items:center; justify-content:center; padding:0}
.rail-nav svg{width:20px; height:20px; display:block}
.rail-nav[data-dir="-1"]{left:0}
.rail-nav[data-dir="1"]{right:0}
.rail-nav:hover{border-color:var(--ctrl-accent); color:var(--ctrl-accent)}
.rail-nav.hide{visibility:hidden}
.cprog{position:absolute; left:0; right:0; bottom:0; height:4px; background:rgba(0,0,0,.55)}
.cprog span{display:block; height:100%; background:var(--ctrl-accent)}
.card-x{position:absolute; top:7px; right:7px; width:32px; height:32px; border:none;
  border-radius:50%; background:rgba(0,0,0,.62); color:#fff; line-height:1; padding:0;
  cursor:pointer; display:flex; align-items:center; justify-content:center}
.card-x svg{width:15px; height:15px; display:block}
.card-x:hover{background:rgba(0,0,0,.85)}

/* ---------- year sections + grid ---------- */
.year-h{
  font-size:30px; font-weight:800; color:var(--text); letter-spacing:.2px;
  margin:72px 0 6px; padding-bottom:10px; border-bottom:1px solid var(--border);
}
#grid-wrap > .year-h:first-child{margin-top:8px}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px 16px}
.card{cursor:pointer; display:flex; flex-direction:column; gap:8px}
.card .thumb{
  position:relative; aspect-ratio:16/9; border-radius:var(--radius); overflow:hidden;
  background:#222; box-shadow:0 0 0 1px var(--border) inset;
}
.card .thumb img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .25s}
.card:hover .thumb img{transform:scale(1.045)}
.card.active .thumb{outline:2px solid var(--ctrl-accent); outline-offset:0}
.card .ctitle{
  font-size:14px; font-weight:600; line-height:1.35;
  display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
/* meta line: date, comments, duration — one uniform group, no box */
.card .cmeta{font-size:10px; color:var(--muted); display:flex; align-items:center;
  flex-wrap:wrap; gap:3px 4px; line-height:1}
.card .cmeta .mi{display:inline-flex; align-items:center; gap:4px}

.cbody{display:flex; align-items:flex-start; gap:8px}
.cbody .ctitle{flex:1; min-width:0}
.chatglyph,.clockglyph,.calglyph{display:block; color:var(--muted)}
.chatglyph .halo{fill:var(--bg); stroke:var(--bg); stroke-width:2}
.badge-sep{color:var(--border)}
.chatchip{display:inline-flex; align-items:center; gap:6px}

.fine{color:#666; font-size:11px; margin-top:48px; text-align:center; line-height:1.7}
.fine a{color:#888; text-decoration:underline}

/* browse: grid + year nav */
.browse{display:flex; gap:24px; align-items:flex-start}
.grid-col{flex:1; min-width:0; width:100%; max-width:100%}
.side{
  width:240px; flex:none; position:sticky; top:20px;
  max-height:calc(100vh - 40px); overflow:auto;
  display:flex; flex-direction:column; gap:14px;
}
.year-h,.month-h,.card{scroll-margin-top:72px}
.yh-count{font-weight:400; color:#777; font-size:13px; margin-left:6px}
.month-h{font-size:19px; font-weight:700; color:var(--text); letter-spacing:.2px; margin:48px 0 14px}
.year-h + .month-h{margin-top:16px}
.mh-count{font-weight:400; color:#777; font-size:14px; margin-left:8px}
.yearnav{
  background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius);
  padding:10px; font-size:13px;
}
.yn-title{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.6px; padding:4px 8px 10px}
.yn-year{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:7px 9px; border-radius:8px; cursor:pointer; font-weight:600;
}
.yn-year:hover{background:#262626}
.yn-year.open{background:#242424; color:var(--accent)}
.yn-count{color:var(--muted); font-weight:400; font-size:12px}
.yn-year.open .yn-count{color:var(--accent)}
.yn-months{display:flex; flex-direction:column; margin:2px 0 8px 10px; border-left:1px solid var(--border); padding-left:6px}
.yn-month{display:flex; justify-content:space-between; gap:8px; padding:5px 9px; border-radius:6px; cursor:pointer; color:var(--muted)}
.yn-month:hover{background:#262626; color:var(--text)}
@media (max-width:860px){
  .browse{flex-direction:column}
  .side{order:-1; width:auto; position:static; max-height:none; overflow:visible}
  .yearnav{display:none}
}
</style>

const RESUME_KEY = 'macawResume';

function setResume(id, t){

function clearResume(id){ const m = loadResume(); delete m[String(id)]; saveResumeMap(m); }

function recentWatched(limit){
  const m = loadResume();
  const rows = Object.keys(m)
    .map((id) => { const e = m[id]; const o = (typeof e === 'number') ? { t: e, at: 0 } : e;
      return { v: byId[id], t: o && o.t, at: (o && o.at) || 0, dur: (o && o.dur) || 0 }; })
    .filter((r) => r.v && r.t > 0);

  // gone (the resume-seek transient can delete it), BUT only once it's genuinely
  // being watched (past the threshold). Without this gate the home page's
  // auto-loaded video would keep reappearing and survive removal/Clear.
  if (activeVideo && byId[String(activeVideo.vodid)]){
    const aid = String(activeVideo.vodid);
    const t = (vjs && isFinite(vjs.currentTime())) ? vjs.currentTime() : 0;
    if (t >= RESUME_MIN && !rows.some((r) => String(r.v.vodid) === aid)){
      const dur = (vjs && isFinite(vjs.duration())) ? vjs.duration() : (activeVideo.duration_seconds || 0);
      rows.push({ v: byId[aid], t: t, at: Date.now(), dur: dur });

}

function parseLocation(){
  let id = '', t = null;
  const mh = /(?:^|[#&])t=(\d+)/.exec(location.hash); if (mh) t = parseInt(mh[1], 10);
  // primary: the path segment after the app base is the vodid
  if (location.pathname.startsWith(APP_BASE)){
    const seg = location.pathname.slice(APP_BASE.length).split('/')[0];
    if (seg && seg !== 'index.html') id = decodeURIComponent(seg);
  }
  // legacy "?v=<id>&t=" query link
  if (!id){
    const q = new URLSearchParams(location.search);
    id = q.get('v') || '';
    const qt = q.get('t'); if (t == null && qt && /^\d+$/.test(qt)) t = parseInt(qt, 10);
  }
  // legacy bare "#<id>&t=<sec>" hash link
  if (!id && location.hash.length > 1){
    const parts = location.hash.slice(1).split('&');
    if (/^\d+$/.test(parts[0])){
      id = parts[0];
      for (let i = 1; i < parts.length; i++){ const m = /^t=(\d+)$/.exec(parts[i]); if (m) t = parseInt(m[1], 10); }
    }
  }
  return { id, t };
}

function copyLinkAtTime(v, btn){
  const t = vjs ? Math.floor(vjs.currentTime() || 0) : 0;
  const url = location.origin + deepLink(v.vodid, t);

  };

      ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done();
    } catch (e) {}

// Desktop: fullscreen the stage (video + chat side by side) via the .in-fs class.
function enterFullscreenUI(){
  const stage = document.getElementById('stage');
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (!stage || (fsEl && fsEl !== stage)) return; // ignore native <video> fullscreen (mobile)
  stage.classList.add('in-fs');
  chatEl.style.height = '';                       // let CSS size the chat in fullscreen
}
function exitFullscreenUI(){
  const stage = document.getElementById('stage');
  if (stage) stage.classList.remove('in-fs');

}
// Native <video> fullscreen (the iOS system player): video only, no chat. Kept as an
// escape hatch in the settings menu on phones — it also enables system PiP / auto-PiP.
function enterNativeVideoFullscreen(){
  const videoEl = shell.querySelector('video');
  if (!videoEl) return;
  videoEl.controls = true;
  const clear = () => { videoEl.controls = false; };
  videoEl.addEventListener('webkitendfullscreen', clear, { once: true });          // iOS
  document.addEventListener('fullscreenchange', function h(){ if (!document.fullscreenElement){ clear(); document.removeEventListener('fullscreenchange', h); } });
  if (typeof videoEl.webkitEnterFullscreen === 'function') videoEl.webkitEnterFullscreen();
  else if (videoEl.requestFullscreen) videoEl.requestFullscreen();
  else if (videoEl.webkitRequestFullscreen) videoEl.webkitRequestFullscreen();
}

function toggleStageFullscreen(){
  const stage = document.getElementById('stage');
  if (!stage) return;
  // Mobile: native <video> fullscreen (a <div> can't be fullscreened on iOS).
  if (isMobile()){ enterNativeVideoFullscreen(); return; }
  // Desktop: fullscreen the stage div (keeps the chat alongside).
  if (document.fullscreenElement || document.webkitFullscreenElement){
    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
    return;
  }
  (stage.requestFullscreen || stage.webkitRequestFullscreen || function(){}).call(stage);
}

    if (isMobile() && !mobileChatAuto && !chatOn){
      mobileChatAuto = true;
      chatOn = true; setChatVisible(true); chatBtn.classList.toggle('on', true);
      requestAnimationFrame(sizeChat);
    }
  });
  p.on('pause', () => { playBtn.innerHTML = ICON_PLAY; bar.classList.remove('hide'); clearTimeout(ctrlHideT); if (header && !isMobile()) header.classList.remove('collapsed'); });

  const updMute = () => { muteBtn.innerHTML = (p.muted() || p.volume() === 0) ? ICON_MUTE : ICON_VOL; };
  const paintVol = () => {
    const pct = (parseFloat(vol.value) || 0) * 100;
    vol.style.background = 'linear-gradient(to right, var(--ctrl-accent) 0%, var(--ctrl-accent) '
      + pct + '%, rgba(255,255,255,.32) ' + pct + '%, rgba(255,255,255,.32) 100%)';
  };
  vol.value = p.muted() ? 0 : p.volume();
  // On phones the volume bar is hidden; tapping the icon reveals it (drag to 0 = mute).
  muteBtn.addEventListener('click', () => {
    if (isMobile()){ bar.classList.toggle('vol-open'); showControls(); return; }
    p.muted(!p.muted());
  });
  vol.addEventListener('input', () => { const x = parseFloat(vol.value); p.volume(x); p.muted(x === 0); paintVol(); });
  p.on('volumechange', () => { vol.value = p.muted() ? 0 : p.volume(); updMute(); paintVol(); });
  updMute(); paintVol();

  function paint(){
    const d = p.duration() || 0, f = d ? Math.min(1, p.currentTime() / d) : 0;
    played.style.width = (f * 100) + '%';
    handle.style.left = (f * 100) + '%';
    try { buf.style.width = (d ? Math.min(1, p.bufferedEnd() / d) * 100 : 0) + '%'; } catch (e) {}
    // On phones, while scrubbing, show just the current time (the bar is otherwise hidden).
    timeEl.textContent = (bar.classList.contains('scrubbing') && isMobile())
      ? fmtTime(p.currentTime())
      : fmtTime(p.currentTime()) + ' / ' + fmtTime(d);
  }
  p.on('timeupdate', paint); p.on('durationchange', paint); p.on('progress', paint); paint();

  let dragging = false;
  const seekTo = (x) => {
    const r = scrub.getBoundingClientRect();
    const f = Math.min(1, Math.max(0, (x - r.left) / r.width));
    const d = p.duration(); if (d) p.currentTime(f * d);
  };
  scrub.addEventListener('pointerdown', (e) => { dragging = true; bar.classList.add('scrubbing'); try { scrub.setPointerCapture(e.pointerId); } catch (_) {} seekTo(e.clientX); paint(); });
  scrub.addEventListener('pointermove', (e) => { if (dragging){ seekTo(e.clientX); paint(); } });
  scrub.addEventListener('pointerup', () => { dragging = false; bar.classList.remove('scrubbing'); paint(); });

  chatBtn.classList.toggle('on', chatOn);
  chatBtn.addEventListener('click', () => {
    chatOn = !chatOn; setChatVisible(chatOn); chatBtn.classList.toggle('on', chatOn); requestAnimationFrame(sizeChat);
  });
  // ----- settings popover: speed, quality, and the <--> fill-edges toggle -----
  const gearBtn = q('[data-a=settings]'), menu = q('[data-menu]');
  const openMenu = (on) => { menu.hidden = !on; gearBtn.classList.toggle('on', on); gearBtn.setAttribute('aria-expanded', on ? 'true' : 'false'); };
  gearBtn.addEventListener('click', () => openMenu(menu.hidden));
  // tap anywhere outside the control bar closes it (bar taps are stopped above).
  // Drop any previous video's handler so they don't accumulate across switches.
  if (menuDocHandler) document.removeEventListener('click', menuDocHandler);
  menuDocHandler = (e) => { if (!menu.hidden && !bar.contains(e.target)) openMenu(false); };
  document.addEventListener('click', menuDocHandler);

  // playback speed
  const speeds = [0.5, 1, 1.5, 2];
  const speedWrap = q('[data-speeds]');
  speedWrap.innerHTML = speeds.map((s) => '<button type="button" class="cm-speed" data-rate="' + s + '">' + s + '×</button>').join('');
  const speedBtns = speedWrap.querySelectorAll('.cm-speed');
  const paintSpeed = () => speedBtns.forEach((b) => b.classList.toggle('on', parseFloat(b.dataset.rate) === playRate));
  speedBtns.forEach((b) => b.addEventListener('click', () => { playRate = parseFloat(b.dataset.rate); try { p.playbackRate(playRate); } catch (e) {} paintSpeed(); }));
  try { p.playbackRate(playRate); } catch (e) {}
  p.on('ratechange', () => { const r = p.playbackRate(); if (r){ playRate = r; paintSpeed(); } });
  paintSpeed();

  // <--> fill into the safe-area (notch) margins; remembered across visits
  const edgeItem = q('[data-a=edge]'), edgeState = q('[data-edge-state]');
  const paintEdge = () => { const on = document.body.classList.contains('immersive'); edgeItem.classList.toggle('on', on); edgeState.textContent = on ? 'On' : 'Off'; };
  edgeItem.addEventListener('click', () => {
    const on = document.body.classList.toggle('immersive');
    try { localStorage.setItem('macawImmersive', on ? '1' : '0'); } catch (e) {}
    paintEdge(); requestAnimationFrame(sizeChat);
  });
  paintEdge();

  // ----- quality picker: AV1 (low bandwidth) vs HLS/H.264 -----
  // HLS = the original master (native HLS on Safari, VHS/ABR elsewhere).
  // AV1 = the AV1 rendition pinned to a single codec. On MSE (Firefox/Chrome) we
  // must hand VHS a MASTER manifest carrying the real CODECS="av01..." — a bare
  // media playlist gives VHS no codec to test, so it excludes it ("no supported
  // playlists"); the direct mp4 plays but has no duration so it can't seek. With
  // the CODECS hint VHS loads the media playlist and seeks by byterange. Safari's
  // native HLS handles the media playlist directly, so it just gets that URL.
  const qRow = q('.cm-quality');
  const qBtns = qRow.querySelectorAll('.cm-q');
  let variants = null;   // { hls: masterUrl, h264Media, av1Media, av1Codecs }
  const masterUrl = 'playlists/v' + v.vodid + '.m3u8';
  const hasVhs = () => { try { return !!p.tech(true).vhs; } catch (e) { return false; } };

  function switchVariant(){
    if (!variants) return;
    const isAv1 = quality === 'av1';
    let src = variants.hls;
    if (isAv1){
      if (hasVhs()){
        // synthetic single-rendition master so VHS knows the codec up front
        const man = '#EXTM3U\n#EXT-X-VERSION:7\n#EXT-X-STREAM-INF:BANDWIDTH=3000000,CODECS="'
          + variants.av1Codecs + '"\n' + variants.av1Media + '\n';
        src = 'data:application/x-mpegURL;charset=utf-8,' + encodeURIComponent(man);
      } else {
        src = variants.av1Media;   // Safari native HLS reads the media playlist itself
      }
    }
    const t = p.currentTime() || 0, wasPlaying = !p.paused();
    p.src({ src: src, type: 'application/x-mpegURL' });
    p.one('loadedmetadata', () => {
      try { if (t) p.currentTime(t); } catch (e) {}
      try { p.playbackRate(playRate); } catch (e) {}
      if (wasPlaying){ const pr = p.play(); if (pr && pr.catch) pr.catch(() => {}); }
    });
  }
  const paintQuality = () => qBtns.forEach((b) => b.classList.toggle('on', b.dataset.q === quality));
  qBtns.forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.q === quality) return;
    quality = b.dataset.q;
    try { localStorage.setItem('macawQuality', quality); } catch (e) {}
    paintQuality(); switchVariant();
  }));
  paintQuality();

  // Parse the master → the AV1 rendition's media-playlist URL + its CODECS string.
  (function initQuality(){
    fetch(masterUrl).then((r) => r.ok ? r.text() : '').then((txt) => {
      if (!txt) return;
      const dir = masterUrl.replace(/[^/]*$/, ''), lines = txt.split(/\r?\n/);
      const abs = (uri) => new URL(uri, new URL(dir, location.href)).href;
      let av1Media = null, av1Codecs = '', h264Media = null;
      for (let i = 0; i < lines.length; i++){
        if (!/^#EXT-X-STREAM-INF/i.test(lines[i])) continue;
        const cm = /CODECS="([^"]*)"/i.exec(lines[i]), codecs = cm ? cm[1] : '';
        let j = i + 1; while (j < lines.length && (!lines[j].trim() || lines[j].startsWith('#'))) j++;
        const uri = (lines[j] || '').trim(); if (!uri) continue;
        if (/av01/i.test(codecs) && !av1Media){ av1Media = abs(uri); av1Codecs = codecs; }
        else if (/(avc1|h264)/i.test(codecs) && !h264Media){ h264Media = abs(uri); }
      }
      if (!av1Media || !h264Media) return;   // no choice to offer
      variants = { hls: masterUrl, h264Media: h264Media, av1Media: av1Media, av1Codecs: av1Codecs };
      const apply = () => {
        qRow.style.display = 'block';
        if (quality === 'av1') switchVariant();   // honor a persisted AV1 preference
      };
      if (p.readyState() >= 1) apply(); else p.one('loadedmetadata', apply);
    }).catch(() => {});
  })();

  q('[data-a=fs]').addEventListener('click', toggleStageFullscreen);
}

function renderFeatured(v){
  document.title = v.title + ' | macaw45 archive';
  if (vjs){
    // Save the OUTGOING video's real position first, then suppress the pause that
    // dispose() fires (currentTime ~0) so it can't wipe the entry we just wrote.
    try { if (activeVideo) setResume(activeVideo.vodid, vjs.currentTime() || 0); } catch (e) {}
    suppressResumeSave = true;
    try { vjs.dispose(); } catch (e) {}
    suppressResumeSave = false;
    vjs = null;
  }
  activeVideo = v;
  shell.innerHTML = videoSourceHtml(v);
  if (window.videojs){
    vjs = videojs(shell.querySelector('video'), { controls: false });
    setupControls(v);
  }
  // Seek target: an explicit "?t=" deep link wins; otherwise resume where we left off.
  let seekTo = pendingSeek; pendingSeek = null;
  if (seekTo == null) seekTo = getResume(v.vodid);
  if (seekTo != null && vjs){
    const _t = seekTo;
    vjs.ready(() => vjs.one('loadedmetadata', () => { try { vjs.currentTime(_t); } catch (e) {} }));
  }
  if (vjs){
    let lastSave = 0;
    vjs.on('timeupdate', () => {
      if (suppressResumeSave) return;
      const now = Date.now();
      if (now - lastSave < 5000) return;
      lastSave = now; setResume(v.vodid, vjs.currentTime() || 0);
    });
    vjs.on('pause', () => { if (!suppressResumeSave) setResume(v.vodid, vjs.currentTime() || 0); });
    vjs.on('ended', () => { if (!suppressResumeSave) clearResume(v.vodid); });
  }
  setupChat(v);

  titleEl.textContent = v.title;
  descEl.textContent  = v.description || '';
  descEl.style.display = v.description ? '' : 'none';

  const bareDate = (v.date || '').slice(0,10);
  const chatChip = (typeof v.chat === 'number' && v.chat > 0)
    ? '<span class="chatchip">' + chatGlyph() + '<span>' + v.chat.toLocaleString() + ' messages</span></span>' : '';
  const durStr = fmtDuration(v.duration_seconds);
  const durChip = durStr
    ? '<span class="chatchip">' + clockGlyph() + '<span>' + durStr + '</span></span>' : '';
  metaEl.innerHTML =
      '<span>' + esc(fmtDate(v.date)) + '</span>'
    + chatChip
    + durChip
    + '<button type="button" class="btn" id="copy-link">' + COPY_LABEL + '</button>'
    + '<a class="btn" href="' + downloadUrl(v) + '" download="' + esc(bareDate + ' ' + v.title + ' [' + v.vodid + ']') + '">⤓ Download</a>';
  const _cl = document.getElementById('copy-link');
  if (_cl) _cl.addEventListener('click', () => copyLinkAtTime(v, _cl));
}

// Cap the chat column to the player's rendered height so it scrolls internally
// instead of stretching the row (the player's height comes from its aspect-ratio,
// which CSS can't hand to a fixed-width sibling — so measure it).
// Landscape phone: drive the layout from the DISPLAY HEIGHT. Size the player-shell
// (video + controls below it) to fit the visible height, deriving the video area as
// 16:9 off the height left after the control bar — so the shell's WIDTH comes from
// the height. Chat (flex:1) then fills the remaining width. Non-landscape clears the
// inline overrides so CSS/aspect-ratio drives width as before.
// Cached once per orientation: the video height must NOT track scroll or Safari's
// toolbar show/hide (both fire resize). Reset to 0 on orientationchange to recapture.
let lsHeight = 0;
function sizeStageLandscape(){
  const st = document.getElementById('stage');
  const v = shell.querySelector('.video-js');
  if (!st || st.classList.contains('in-fs') || !isLandscapePhone()){
    if (shell.style.width || shell.style.flex){ shell.style.width = ''; shell.style.flex = ''; }
    if (v && (v.style.height || v.style.aspectRatio)){ v.style.height = ''; v.style.aspectRatio = ''; }
    lsHeight = 0;
    return;
  }
  // Full physical display height in landscape = the screen's short side (iOS reports
  // screen dims in portrait, so min() is the landscape height). Independent of the
  // Safari toolbar / header — the user scrolls past the header to bring it into view.
  if (!lsHeight) lsHeight = Math.min(window.screen.width, window.screen.height) || window.innerHeight;
  const ctrl = shell.querySelector('.ctrl');
  const ctrlH = ctrl ? ctrl.getBoundingClientRect().height : 0;
  // Video wants full display height; but chat's min-width wins — if the row is too
  // narrow to give the video its full-height width AND chat CHAT_MIN, shrink the video
  // (below full height) so chat keeps CHAT_MIN. Only applies while chat is visible.
  const CHAT_MIN = 250;
  let videoH = Math.max(80, Math.round(lsHeight - ctrlH));
  let shellW = Math.round(videoH * 16 / 9);
  if (!chatEl.classList.contains('off')){
    // inner (content-box) width excludes the stage's safe-area padding, so the video
    // never eats the right inset and push chat behind the notch / cause h-overflow.
    const cs = getComputedStyle(st);
    const innerW = st.getBoundingClientRect().width - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
    const maxVideoW = innerW - CHAT_MIN;                 // width left for the video after chat's floor
    if (maxVideoW > 120 && shellW > maxVideoW){
      shellW = Math.round(maxVideoW);
      videoH = Math.round(shellW * 9 / 16);              // video shrinks; height follows width
    }
  }
  const wPx = shellW + 'px', hPx = videoH + 'px';
  if (shell.style.width !== wPx){ shell.style.width = wPx; shell.style.flex = '0 0 auto'; }
  if (v){ if (v.style.height !== hPx) v.style.height = hPx; if (v.style.aspectRatio !== 'auto') v.style.aspectRatio = 'auto'; }
}

function sizeChat(){
  sizeStageLandscape();
  if (chatEl.classList.contains('off')) return;
  const st = document.getElementById('stage');
  if (st && st.classList.contains('in-fs')) return;   // CSS sizes the chat in fullscreen
  // Stacked layout (portrait / narrow, but NOT the landscape side-by-side): a fixed
  // CSS height caps it. The landscape side-by-side and desktop both pin the chat to
  // the player's height so its log scrolls instead of the whole column growing.
  if (!isLandscapePhone() && window.innerWidth <= 920){ chatEl.style.height = ''; return; }
  const h = shell.getBoundingClientRect().height;
  if (h) chatEl.style.height = h + 'px';
}
// A viewport change (resize / rotation) re-pins the chat height, and if the log
// was following the newest message we snap it back to the bottom — otherwise the
// height change leaves scrollTop where it was and the bottom drifts up.
function nearChatBottom(){ return chatLog.scrollHeight - chatLog.scrollTop - chatLog.clientHeight < 40; }
function onViewportChange(){
  const wasBottom = nearChatBottom();
  sizeChat();
  if (wasBottom){ chatLog.scrollTop = chatLog.scrollHeight; requestAnimationFrame(() => { chatLog.scrollTop = chatLog.scrollHeight; }); }
}
window.addEventListener('resize', onViewportChange);
// iOS reports stale dimensions until the rotation animation settles, so re-pin on
// a delay after orientationchange too (resize alone fires too early there).
window.addEventListener('orientationchange', () => {
  const wasBottom = nearChatBottom();
  lsHeight = 0;   // recapture the display height for the new orientation
  setTimeout(() => { sizeChat(); if (wasBottom) chatLog.scrollTop = chatLog.scrollHeight; }, 300);
});
// rotating a phone into landscape should reveal the header again (it only collapses in portrait)
window.addEventListener('resize', () => {
  if (isLandscapePhone()){ const h = document.querySelector('header.site'); if (h) h.classList.remove('collapsed'); }
});

// Chat replay: as the video plays we fetch that VOD's per-second comment files
// (comments/<id>/<t>.json) and append them, in sync with the player's time.
// Seeking backward rebuilds the log up to the new point. (If you already have a
// chat renderer on your site, you can drop it in here instead.)
const HEX = /^#[0-9a-fA-F]{6}$/;

// Emotes, badges, bits and third-party emotes are served from the archive's own
// copies (emotes/…) — same paths the live site uses, so nothing depends on
// Twitch/AWS. Lookup tables are loaded once (loadChatAssets). Gigantified emotes
// are intentionally not handled.
const URL_RE = /https?:\/\/(www\.)?[-a-zA-Z0-9@:%._+~#=]{1,256}\.[a-zA-Z0-9()]{1,6}\b([-a-zA-Z0-9()@:%_+.~#?&/=]*)/;
const escapeRegex = (s) => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

let THIRD = {}, CHEERS = {}, CHEERS_RE = null, chatAssetsLoaded = false;
function loadChatAssets(){
  if (chatAssetsLoaded) return; chatAssetsLoaded = true;
  fetch(BASE + 'third_party_emotes.json').then(r => r.ok ? r.json() : {})
    .then(j => { THIRD = j || {}; }).catch(() => {});
  fetch(BASE + 'cheers.json').then(r => r.ok ? r.json() : {})
    .then(j => {
      CHEERS = j || {};
      const keys = Object.keys(CHEERS).map(escapeRegex);
      if (keys.length) CHEERS_RE = new RegExp('((?:' + keys.join('|') + ')\\d+)');
    }).catch(() => {});
}

// A non-emote fragment: split into words and render bits, third-party emotes and
// links, mirroring the live site's element_from_chat_fragment.
function fragText(text){
  let out = '';
  for (const str of String(text).split(/\s/)){
    if (str === ''){ out += ' '; continue; }
    if (CHEERS_RE && CHEERS_RE.test(str)){
      const provider = str.replace(/(.*?)(\d+)$/, '$1');
      const bits = str.replace(/.*?(\d+)$/, '$1');
      const tiers = CHEERS[provider];
      if (tiers){
        let amt = 1;
        for (const v of tiers) if (Number(bits) >= v) amt = v;
        out += '<span class="cheerbit"><img class="cheer" src="emotes/twitchBits/' + esc(provider) + '/' + amt
             + '" alt="' + esc(str) + '" title="' + esc(str) + '">' + esc(bits) + '</span> ';
        continue;
      }
    }
    if (THIRD[str]){
      out += '<img class="third_party_emote" src="emotes/thirdParty/' + esc(THIRD[str])
           + '" alt="' + esc(str) + '" title="' + esc(str) + '">';
      continue;
    }
    if (URL_RE.test(str)){
      out += '<a class="chat_link" href="' + esc(str) + '" target="_blank" rel="noopener">' + esc(str) + '</a> ';
      continue;
    }
    out += esc(str) + ' ';
  }
  return out;
}

function msgBody(m){
  const f = m && m.fragments;
  if (Array.isArray(f) && f.length){
    return f.map(x => (x.emoticon && x.emoticon.emoticon_id)
      ? '<img class="emote" src="emotes/firstParty/' + esc(x.emoticon.emoticon_id) + '" alt="' + esc(x.text) + '" title="' + esc(x.text) + '">'
      : fragText(x.text)).join('');
  }
  return esc(m && m.body || '');
}
function commentToHtml(c){
  const m = c.message || {};
  const color  = HEX.test(m.user_color || '') ? m.user_color : '#dcdcdc';
  const badges = (m.user_badges || []).map(b =>
    '<img class="badge" src="emotes/twitchBadges/' + esc(b._id) + '/' + esc(b.version) + '" alt="' + esc(b._id) + '" title="' + esc(b._id) + '">').join('');
  const cm     = c.commenter || {};
  const login  = (cm.name || cm.display_name || '').toLowerCase();
  const user   = cm.display_name || cm.name || '?';
  const name   = login
    ? '<a class="cu" href="https://twitch.tv/' + encodeURIComponent(login) + '" target="_blank" rel="noopener" style="color:' + color + '">' + esc(user) + '</a>'
    : '<span class="cu" style="color:' + color + '">' + esc(user) + '</span>';
  return '<div class="cmsg">' + badges + name
    + '<span class="cc" style="color:var(--muted)">: </span>' + msgBody(m) + '</div>';
}
function setupChat(v){
  if (!CHAT_ENABLED){ setChatVisible(false); return; }
  setChatVisible(chatOn);
  requestAnimationFrame(sizeChat);   // pin height once layout settles
  chatNote.textContent = '';
  chatJump.classList.remove('show');
  chatLog.innerHTML = '<div class="chat-empty">Press play to replay chat in sync with the video.</div>';

  const video = shell.querySelector('video');
  const player = (typeof vjs !== 'undefined' && vjs) ? vjs : null;   // player time is reliable on iOS; raw <video> timeupdate isn't
  const nowSec = () => Math.floor((player ? player.currentTime() : (video ? video.currentTime : 0)) || 0);
  let lastSec = -1, stick = true, active = null, busy = false, cleared = false;
  chatLog.addEventListener('scroll', () => {
    stick = chatLog.scrollHeight - chatLog.scrollTop - chatLog.clientHeight < 40;
    chatJump.classList.toggle('show', !stick);
  });
  // index of seconds that actually have chat, so we skip fetching empty ones
  fetch(BASE + 'comments/' + v.vodid + '.json')
    .then(r => r.ok ? r.json() : []).then(a => { active = new Set(a); })
    .catch(() => { active = new Set(); });

  // Only ever fetch a short trailing window (matches the live site): normal play
  // pulls the one new second; a seek pulls just the last few seconds, never every
  // second since the start — that would hammer the server on each scrub, and
  // nobody scrolls chat back that far anyway.
  const SEEK_WINDOW = 5;
  async function tick(){
    if ((!player && !video) || busy) return;
    const cur = nowSec();
    if (cur === lastSec) return;
    if (!chatOn){ lastSec = cur; return; }   // chat toggled off: don't fetch
    busy = true;
    // A jump (seek back, or forward past the trailing window) is a new context —
    // wipe the stale messages before loading the new window; normal play appends.
    const jumped = lastSec >= 0 && (cur < lastSec || cur - lastSec > SEEK_WINDOW);
    if (!cleared || jumped){ chatLog.innerHTML = ''; cleared = true; stick = true; chatJump.classList.remove('show'); }
    let start = jumped ? cur - SEEK_WINDOW : Math.max(cur - SEEK_WINDOW, lastSec + 1);
    lastSec = cur;
    for (let s = start; s <= cur; s++){
      if (s < 0 || (active && !active.has(s))) continue;
      try {
        const msgs = await (await fetch(BASE + 'comments/' + v.vodid + '/' + s + '.json')).json();
        for (const c of (Array.isArray(msgs) ? msgs : []))
          chatLog.insertAdjacentHTML('beforeend', commentToHtml(c));
      } catch (e) {}
    }
    if (stick) chatLog.scrollTop = chatLog.scrollHeight;
    busy = false;
  }
  if (player){ player.on('timeupdate', tick); player.on('seeked', tick); }
  if (video) video.addEventListener('timeupdate', tick);
}

function cardHtml(v, opts){
  opts = opts || {};
  // optional resume progress bar (0..1) along the bottom of the thumbnail
  let bar = '';
  if (opts.progress > 0){
    const pct = Math.max(2, Math.min(100, opts.progress * 100));
    bar = '<div class="cprog"><span style="width:' + pct.toFixed(1) + '%"></span></div>';
  }
  const rm = opts.removable
    ? '<button type="button" class="card-x" data-rm="' + v.vodid + '" aria-label="Remove from continue watching" title="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'
    : '';
  // A real <a href> so the whole card offers a link context menu (copy link) and
  // supports middle-click / ctrl-click to open the VOD in a new tab.
  return '<a class="card" href="' + APP_BASE + v.vodid + '" data-id="' + v.vodid + '" data-ym="' + (v.date||'').slice(0,7) + '">'
    +   '<div class="thumb"><img loading="lazy" alt="" src="' + thumbUrl(v,'720') + '"'
    +     ' onerror="this.style.visibility=\'hidden\'">' + bar + rm + '</div>'
    +   '<div class="cbody"><div class="ctitle">' + esc(v.title) + '</div></div>'
    +   '<div class="cmeta">' + cardMeta(v) + '</div>'
    + '</a>';
}
// "Continue watching" rail — the most-recent resume positions, above the grid.
function recentRailHtml(){
  const rec = recentWatched(8);
  if (!rec.length) return '';
  const cards = rec.map((r) => {
    const dur = r.dur || r.v.duration_seconds || 0;
    return cardHtml(r.v, { progress: dur ? r.t / dur : 0, removable: true });
  }).join('');
  return '<section class="rail">'
    + '<div class="rail-head"><span>Continue watching</span>'
    +   '<button type="button" class="rail-clear" id="rail-clear">Clear</button></div>'
    + '<div class="rail-body">'
    +   '<button type="button" class="rail-nav" data-dir="-1" aria-label="Scroll left">'
    +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5"/><path d="M11 6l-6 6 6 6"/></svg></button>'
    +   '<div class="rail-track"><div class="rail-row">' + cards + '</div></div>'
    +   '<button type="button" class="rail-nav" data-dir="1" aria-label="Scroll right">'
    +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"/><path d="M13 6l6 6-6 6"/></svg></button>'
    + '</div></section>';
}

// Single-row continue-watching pager: buttons scroll the track ~one page and
// disable at each end.
function wireRailPager(){
  const track = gridWrap.querySelector('.rail-track');
  if (!track) return;
  const body = track.closest('.rail-body');
  const navs = gridWrap.querySelectorAll('.rail-nav');
  const sync = () => {
    const max = track.scrollWidth - track.clientWidth - 1;
    const atStart = track.scrollLeft <= 0;
    const atEnd = track.scrollLeft >= max;
    navs.forEach((b) => {
      const dir = parseInt(b.getAttribute('data-dir'), 10);
      b.classList.toggle('hide', dir < 0 ? atStart : atEnd);
    });
    body.classList.toggle('fade-l', !atStart);
    body.classList.toggle('fade-r', !atEnd && max > 0);
  };
  navs.forEach((b) => b.addEventListener('click', () => {
    const dir = parseInt(b.getAttribute('data-dir'), 10);
    track.scrollBy({ left: dir * Math.max(track.clientWidth * 0.85, 200) });
  }));
  track.addEventListener('scroll', sync, { passive: true });
  sync();
}

function renderGrid(){
  const terms = state.query.toLowerCase().split(/\s+/).filter(Boolean);
  let list = VIDEOS.filter(v => {
    if (!terms.length) return true;
    const hay = (v.title + ' ' + (v.description || '')).toLowerCase();
    return terms.every(t => hay.includes(t));
  });

  // Each key has a default (descending) comparator; sortRev flips the whole thing.
  const cmp = {
    date: (a,b) => byNewest(a,b),
    chat: (a,b) => (b.chat||0) - (a.chat||0) || byNewest(a,b),
    dur:  (a,b) => (b.duration_seconds||0) - (a.duration_seconds||0) || byNewest(a,b),
  }[state.sortKey] || byNewest;
  const dir = state.sortRev ? -1 : 1;
  list.sort((a,b) => dir * cmp(a,b));

  countEl.textContent = list.length + ' video' + (list.length === 1 ? '' : 's');

  // Year sections (and the year nav) only make sense for date-ordered views.
  const flat = (state.sortKey !== 'date');
  // "Continue watching" rail only on the unfiltered browse view.
  const rail = terms.length ? '' : recentRailHtml();

  if (!list.length){
    gridWrap.innerHTML = '<div class="count">no matches</div>';
    renderYearNav([], true);
    return;
  }

  if (flat){
    const name = state.sortKey === 'chat' ? 'chat count' : 'duration';
    const ord = state.sortRev ? '↑ ascending' : '↓ descending';
    const hdr = '<div class="year-h">Sorted by ' + name
      + ' <span class="yh-count">' + ord + '</span></div>';
    gridWrap.innerHTML = rail + hdr + '<div class="grid">' + list.map((v) => cardHtml(v)).join('') + '</div>';
  } else {
    const groups = [];
    let cur = null;
    for (const v of list){
      const y = yearOf(v.date);
      if (!cur || cur.year !== y){ cur = { year:y, items:[] }; groups.push(cur); }
      cur.items.push(v);
    }
    gridWrap.innerHTML = rail + groups.map(g => {
      // sub-group each year into months, preserving order
      const months = [];
      let cm = null;
      for (const v of g.items){
        const ym = (v.date||'').slice(0,7);
        if (!cm || cm.ym !== ym){ cm = { ym, items:[] }; months.push(cm); }
        cm.items.push(v);
      }
      return '<div class="year-h" id="y-' + g.year + '">' + esc(g.year)
        +   ' <span class="yh-count">' + g.items.length + ' video' + (g.items.length===1?'':'s') + '</span></div>'
        + months.map(m =>
            '<div class="month-h" id="m-' + m.ym + '">' + monthNameFull(m.ym) + ' ' + g.year
          +   ' <span class="mh-count">' + m.items.length + '</span></div>'
          + '<div class="grid">' + m.items.map(cardHtml).join('') + '</div>'
          ).join('');
    }).join('');
  }

  gridWrap.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', (e) => {
      // let the browser handle modifier/middle clicks natively (open in new tab)
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      selectVideo(el.getAttribute('data-id'));
    });
  });
  const railClear = document.getElementById('rail-clear');
  if (railClear) railClear.addEventListener('click', () => {
    try { localStorage.removeItem(RESUME_KEY); } catch (e) {}
    renderGrid();
  });
  wireRailPager();
  gridWrap.querySelectorAll('.card-x').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();   // don't open the card
      clearResume(btn.getAttribute('data-rm'));
      // Remove just this rail card from the DOM — a full re-render would re-read
      // storage and could momentarily drop the actively-playing video (its live
      // position is only persisted every ~5s), making other cards vanish too.
      const card = btn.closest('.card'), rail = btn.closest('.rail');
      if (card) card.remove();
      if (rail && !rail.querySelector('.card')) rail.remove();
    });
  });
  markActive();
  renderYearNav(list, flat);
}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthName(ym){ const i = parseInt(ym.slice(5,7),10) - 1; return MONTHS[i] || ym; }
function monthNameFull(ym){ const i = parseInt(ym.slice(5,7),10) - 1; return MONTHS_FULL[i] || ym; }

// Chat activity: a speech-bubble glyph + the VOD's total chat message count,
// abbreviated (1.2k, 22.9k, 1.1M) so it fits the small chip. Ordering uses the
// raw count.
function fmtCount(n){
  n = Math.round(n || 0);
  if (n < 1000) return '' + n;
  const div = n < 1e6 ? 1000 : 1e6;
  const suf = n < 1e6 ? 'k' : 'M';
  return (n / div).toFixed(1).replace(/\.0$/, '') + suf;
}
function chatGlyph(){
  // two overlapping speech bubbles; front bubble gets a bg-coloured halo (stroke)
  // so it reads as separate from the back one
  const B = 'M2.5 0 H8.5 A2.5 2.5 0 0 1 11 2.5 V5.5 A2.5 2.5 0 0 1 8.5 8 H5 L2 11 V8 A2.5 2.5 0 0 1 0 5.5 V2.5 A2.5 2.5 0 0 1 2.5 0 Z';
  return '<svg class="chatglyph" width="15" height="12" viewBox="0 0 20 16" aria-hidden="true">'
    + '<g transform="translate(9,0)"><path fill="currentColor" d="' + B + '"/></g>'
    + '<g transform="translate(0,5)"><path class="halo" d="' + B + '"/><path fill="currentColor" d="' + B + '"/></g>'
    + '</svg>';
}
function clockGlyph(){
  return '<svg class="clockglyph" width="12" height="12" viewBox="0 0 24 24" fill="none"'
    + ' stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'
    + ' aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>';
}
function calendarGlyph(){
  return '<svg class="calglyph" width="12" height="12" viewBox="0 0 24 24" fill="none"'
    + ' stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'
    + ' aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2"/>'
    + '<path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>';
}
function fmtDuration(secs){
  secs = Math.round(secs || 0);
  if (secs <= 0) return '';
  if (secs < 3600) return Math.max(1, Math.round(secs / 60)) + 'min';
  const h = secs / 3600;
  const val = (h < 10 ? h.toFixed(1) : Math.round(h).toString()).replace(/\.0$/, '');
  return val + 'hr' + (val === '1' ? '' : 's');
}
// Grid meta: date · comments · duration — one uniform group; each shown only when present.
function cardMeta(v){
  const items = ['<span class="mi">' + calendarGlyph() + esc(fmtDate(v.date)) + '</span>'];
  if (typeof v.chat === 'number' && v.chat > 0)
    items.push('<span class="mi" title="' + v.chat.toLocaleString() + ' chat messages">'
      + chatGlyph() + fmtCount(v.chat) + '</span>');
  const dur = fmtDuration(v.duration_seconds);
  if (dur) items.push('<span class="mi" title="' + dur + ' long">' + clockGlyph() + dur + '</span>');
  return items.join('<span class="badge-sep">·</span>');
}

function renderYearNav(list, flat){
  const nav = document.getElementById('yearnav');
  if (flat || !list.length){ nav.style.display = 'none'; nav.innerHTML = ''; return; }
  nav.style.display = '';

  // group by year -> months, preserving the list's (already sorted) order
  const years = new Map();
  for (const v of list){
    const y = yearOf(v.date), ym = (v.date||'').slice(0,7);
    if (!years.has(y)) years.set(y, { count:0, months:new Map() });
    const yr = years.get(y);
    yr.count++;
    yr.months.set(ym, (yr.months.get(ym)||0) + 1);
  }

  let html = '<div class="yn-title">Jump to</div>';
  for (const [y, yr] of years){
    const open = state.expandedYear === y;
    html += '<div class="yn-year' + (open ? ' open' : '') + '" data-year="' + y + '">'
          +   '<span>' + y + '</span><span class="yn-count">' + yr.count + '</span></div>';
    if (open){
      html += '<div class="yn-months">';
      for (const [ym, c] of yr.months){
        html += '<div class="yn-month" data-ym="' + ym + '"><span>' + monthName(ym)
              + '</span><span class="yn-count">' + c + '</span></div>';
      }
      html += '</div>';
    }
  }
  nav.innerHTML = html;

  nav.querySelectorAll('.yn-year').forEach(el => el.addEventListener('click', () => {
    const y = el.getAttribute('data-year');
    state.expandedYear = (state.expandedYear === y) ? null : y;
    renderYearNav(list, flat);
    const sec = document.getElementById('y-' + y);
    if (sec) sec.scrollIntoView({ behavior:'smooth', block:'start' });
  }));
  nav.querySelectorAll('.yn-month').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    const ym = el.getAttribute('data-ym');
    const target = document.getElementById('m-' + ym)
                || gridWrap.querySelector('.card[data-ym="' + ym + '"]');
    if (target) target.scrollIntoView({ behavior:'smooth', block:'start' });
  }));
}

function markActive(){
  gridWrap.querySelectorAll('.card').forEach(el => {
    el.classList.toggle('active', el.getAttribute('data-id') === String(state.current));
  });
}

function selectVideo(id, push, seekTo){
  const v = byId[String(id)];
  if (!v) return;
  state.current = String(id);
  pendingSeek = (typeof seekTo === 'number') ? seekTo : null;
  if (push !== false && parseLocation().id !== state.current){
    history.pushState(null, '', deepLink(state.current, 0));
  }
  renderFeatured(v);
  markActive();
  window.scrollTo({ top:0, behavior:'smooth' });
}

// events
function syncSearch(){
  state.query = searchEl.value.trim();
  clearEl.parentElement.classList.toggle('has-text', searchEl.value.length > 0);
  renderGrid();
}
searchEl.addEventListener('input', syncSearch);
clearEl.addEventListener('click', () => { searchEl.value = ''; syncSearch(); searchEl.focus(); });
// ↓ = the key's default (descending) order, ↑ = reversed.
function paintSortRev(){ sortRevEl.textContent = state.sortRev ? '↑' : '↓'; }
sortEl.addEventListener('change', () => {
  state.sortKey = sortEl.value; state.sortRev = false; paintSortRev(); renderGrid();
});
sortRevEl.addEventListener('click', () => {
  state.sortRev = !state.sortRev; paintSortRev(); renderGrid();
});

function goHome(){
  searchEl.value = '';
  state.query = '';
  state.sortKey = 'date'; state.sortRev = false;
  sortEl.value = 'date'; paintSortRev();
  state.expandedYear = null;
  clearEl.parentElement.classList.remove('has-text');
  renderGrid();
  window.scrollTo({ top:0, behavior:'smooth' });
}
document.getElementById('home').addEventListener('click', goHome);
  var _logo = document.getElementById('home-logo'); if (_logo) _logo.addEventListener('click', goHome);
// Back/forward (pushState) and any legacy #-link change both route here.
function onLocationNav(){
  const p = parseLocation();
  if (!p.id || !byId[p.id]) return;
  if (p.id !== state.current) selectVideo(p.id, false, p.t);
  else if (p.t != null && vjs){ try { vjs.currentTime(p.t); } catch (e) {} }
}
window.addEventListener('popstate', onLocationNav);
window.addEventListener('hashchange', onLocationNav);
window.addEventListener('beforeunload', () => {
  if (vjs && state.current) setResume(state.current, vjs.currentTime() || 0);
});

// boot: load the catalog from this origin, then start.
function init(){
  for (const v of VIDEOS) byId[String(v.vodid)] = v;
  try { if (localStorage.getItem('macawImmersive') === '1') document.body.classList.add('immersive'); } catch (e) {}
  loadChatAssets();
  const p = parseLocation();
  const linked = p.id && byId[p.id];
  const first = linked ? p.id : VIDEOS.slice().sort(byNewest)[0].vodid;
  selectVideo(first, false, linked ? p.t : null);
  // normalise a legacy "#id" link (or a bare "?id") to the canonical "?v=id" form
  if (linked) history.replaceState(null, '', deepLink(first, p.t || 0));
  renderGrid();
}
fetch(BASE + 'videos.json')
  .then(r => r.json())
  .then(json => { VIDEOS = json; init(); })
  .catch(() => {
    document.querySelector('.wrap').innerHTML =
      '<p style="color:#f66;padding:20px">Couldn\'t load videos.json — serve this page from your site '
      + '(in the same folder as the archive data), not by double-clicking.</p>';
  });

})();
</script>
